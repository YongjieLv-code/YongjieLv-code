<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="YongjieLv-code — 嵌入式工程师 · MCU 固件开发">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8860b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e3b341" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b8860b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="chipGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="padGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1f2733" stroke-width="1">
    <path d="M0 40 H900 M0 80 H900 M0 120 H900 M0 160 H900 M0 200 H900 M60 0 V240 M120 0 V240 M180 0 V240 M240 0 V240 M300 0 V240 M360 0 V240 M420 0 V240 M480 0 V240 M540 0 V240 M600 0 V240 M660 0 V240 M720 0 V240 M780 0 V240 M840 0 V240"/>
  </g>

  <!-- circuit traces (copper) -->
  <g stroke="url(#trace)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M0 56 H70 V110 H150"/>
    <path d="M0 130 H55 V88 H120"/>
    <path d="M0 200 H90 V60 H140"/>
    <path d="M760 46 H840 V150 H900"/>
    <path d="M780 120 H860 V70 H900"/>
    <path d="M740 210 H830 V90 H900"/>
    <path d="M90 46 H300 V30 H420"/>
    <path d="M120 180 H320 V200 H420"/>
  </g>

  <!-- solder pads -->
  <g fill="#e3b341">
    <circle cx="70" cy="56" r="5"/>
    <circle cx="150" cy="110" r="5"/>
    <circle cx="55" cy="130" r="5"/>
    <circle cx="120" cy="88" r="5"/>
    <circle cx="90" cy="200" r="5"/>
    <circle cx="140" cy="60" r="5"/>
    <circle cx="840" cy="150" r="5"/>
    <circle cx="860" cy="70" r="5"/>
    <circle cx="830" cy="90" r="5"/>
    <circle cx="300" cy="30" r="5"/>
    <circle cx="420" cy="30" r="5"/>
    <circle cx="320" cy="200" r="5"/>
    <circle cx="420" cy="200" r="5"/>
    <circle cx="65" cy="106" r="3.5" fill="#c8a13a"/>
    <circle cx="778" cy="119" r="3.5" fill="#c8a13a"/>
  </g>

  <!-- MCU chip -->
  <g filter="url(#chipGlow)">
    <rect x="330" y="70" width="170" height="100" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <!-- pins: top/bottom/left/right -->
    <g stroke="#58a6ff" stroke-width="3" stroke-linecap="round">
      <line x1="360" y1="70" x2="360" y2="48"/>
      <line x1="395" y1="70" x2="395" y2="48"/>
      <line x1="430" y1="70" x2="430" y2="48"/>
      <line x1="465" y1="70" x2="465" y2="48"/>
      <line x1="360" y1="170" x2="360" y2="192"/>
      <line x1="395" y1="170" x2="395" y2="192"/>
      <line x1="430" y1="170" x2="430" y2="192"/>
      <line x1="465" y1="170" x2="465" y2="192"/>
      <line x1="330" y1="90" x2="308" y2="90"/>
      <line x1="330" y1="125" x2="308" y2="125"/>
      <line x1="330" y1="160" x2="308" y2="160"/>
      <line x1="500" y1="90" x2="522" y2="90"/>
      <line x1="500" y1="125" x2="522" y2="125"/>
      <line x1="500" y1="160" x2="522" y2="160"/>
    </g>
    <!-- chip label -->
    <rect x="352" y="88" width="126" height="64" rx="6" fill="#0d1117"/>
    <text x="415" y="112" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#79c0ff" font-weight="bold">MCU</text>
    <text x="415" y="134" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#8b949e">STM32 · 2026</text>
    <!-- notch -->
    <circle cx="330" cy="70" r="3.5" fill="#f85149"/>
  </g>

  <!-- title text -->
  <text x="450" y="232" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="url(#textGlow)">YongjieLv-code</text>
</svg>
